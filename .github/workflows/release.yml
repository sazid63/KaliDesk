name: Release

# Builds the Windows installer and attaches it to a GitHub release.
# The rootfs image is NOT built here: debootstrap needs root and a lot of time,
# and the image is hundreds of megabytes. Build it with runtime/build-rootfs.sh
# and attach it to the release yourself, or host it and set KWS_ROOTFS_URL.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The full CI pipeline (tests, lint, secret scan, shell checks, Windows
  # installer build) must pass before a release is built.
  ci:
    uses: ./.github/workflows/ci.yml

  installer:
    name: Build installer
    needs: ci
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c "exec(open('kws/__about__.py').read()); print(__version__)")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match kws/__about__.py (v${version})" >&2
            exit 1
          fi

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: KaliWindowsSubstitute-Setup
          path: installer/dist/KaliWindowsSubstitute-Setup.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/KaliWindowsSubstitute-Setup.exe
          generate_release_notes: true
          body: |
            ## Kali Linux Windows Substitute

            Not affiliated with OffSec or the Kali Linux project. Use only on
            systems you own or are authorised to test.

            ### Before you install

            You need WSL2 (see [docs/PREREQUISITES.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/PREREQUISITES.md)).
            The first time you open the app, press **Set up runtime**: it downloads and
            verifies the official Kali WSL image and installs the baseline tools
            (internet required, about 2 GB of disk).
