name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite needs Flask, PyYAML and pytest only. pywebview (the GUI
      # shell) is deliberately not installed here: it needs a display, and every
      # test runs headless.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "flask>=3.0,<4" "PyYAML>=6.0,<7" "pytest>=8.0,<9" "ruff>=0.6,<1"

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Headless self-check
        run: python app/main.py --check

      - name: Generated files are current
        run: |
          python tools/gen_docs.py
          python runtime/tools/make_manifest.py \
            catalog/tools.yaml runtime/rootfs/etc/kalisub/tools.json
          git diff --exit-code -- docs runtime/rootfs/etc/kalisub/tools.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  shell:
    name: Shell scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on shell scripts
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -n1 bash -n
