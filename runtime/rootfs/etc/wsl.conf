# Private runtime configuration for Kali Linux Windows Substitute.
#
# This file only affects this distribution. It does not change any other WSL
# distribution and it does not touch Docker Desktop.

[boot]
# Keep systemd off: the runtime only needs to start one small agent process,
# and we do not want this distribution competing with the user's own services.
systemd=false

[interop]
enabled=true
appendWindowsPath=false

[automount]
enabled=true
options="metadata,umask=22,fmask=11"

[network]
generateResolvConf=true
