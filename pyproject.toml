# This project is not published as a Python package. Install its dependencies
# with `pip install -r requirements-dev.txt` (or requirements-build.txt for the
# installer). Do not run `pip install .`: it is not a supported install path.
[project]
name = "kali-windows-substitute"
version = "1.5.0"
description = "A Kali-style security workbench for Windows that runs the real Linux tools in the app's own private WSL2 runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kali Linux Windows Substitute contributors" }]
keywords = ["security", "windows", "wsl2", "pentest", "learning"]
dependencies = [
  "flask>=3.0,<4",
  "Werkzeug>=3.0,<4",
  "PyYAML>=6.0,<7",
  "pywebview>=5.0,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff==0.17.0"]

[project.urls]
Homepage = "https://github.com/sazid63/KaliDesk"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Test data tables read better on one line.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
