<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kali Linux Windows Substitute - AI CyberSecurity Chat</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="ai-chat-panel" class="panel hidden">
    <div class="panel-head">
      <h2>AI CyberSecurity Chat</h2>
      <button class="x" data-close="ai-chat-panel">&times;</button>
    </div>

    <div class="toolbar">
      <select id="ai-chat-mode" class="grow" placeholder="Chat mode">
        <option value="native">KaliDesk Native Chat</option>
        <option value="opencode">OpenCode</option>
        <option value="dsh">DeepSeek Harness</option>
      </select>
      <select id="ai-chat-conversation" class="grow" placeholder="Select conversation...">
        <option value="new">New conversation</option>
      </select>
      <button class="primary" id="ai-chat-new">New chat</button>
      <button class="ghost" id="ai-chat-delete">Delete</button>
      <button class="ghost" id="ai-chat-export">Export</button>
    </div>

    <!-- Native chat view -->
    <div id="ai-chat-native-view">
      <div id="ai-chat-log" class="chat"></div>

      <div class="chat-input">
        <textarea id="ai-chat-input" placeholder="Ask about security tools, techniques, or investigations..."></textarea>
        <div class="ai-row">
          <button class="primary" id="ai-chat-send">Send</button>
          <label class="muted">
            <input type="checkbox" id="ai-chat-beginner"> Explain Like I'm Learning
          </label>
        </div>
      </div>

      <div class="tools-strip" id="ai-chat-tools-strip">
        <!-- Tools chips will be inserted here -->
      </div>
    </div>

    <!-- Embedded OpenCode view -->
    <div id="ai-chat-opencode-view" class="hidden" style="height: calc(100vh - 200px);">
      <iframe id="opencode-iframe" src="http://127.0.0.1:4096" style="width: 100%; height: 100%; border: none; background: white;"></iframe>
    </div>

    <!-- Embedded DSH view -->
    <div id="ai-chat-dsh-view" class="hidden" style="height: calc(100vh - 200px);">
      <iframe id="dsh-iframe" src="http://127.0.0.1:55551" style="width: 100%; height: 100%; border: none; background: white;"></iframe>
    </div>
  </div>
</body>
</html>
