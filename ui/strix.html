<div id="strix-panel" class="panel hidden">
  <div class="panel-head">
    <h2>Strix AI Pentest</h2>
    <button class="x" id="strix-close" title="Close">&times;</button>
  </div>
  
  <div class="strix-header">
    <div class="strix-status">
      <span class="dot" id="strix-dot"></span>
      <span id="strix-text">Checking status...</span>
    </div>
    <div class="strix-actions">
      <button class="primary" id="strix-install" disabled>Install</button>
      <button class="primary" id="strix-start" disabled>Start</button>
      <button class="ghost" id="strix-stop" disabled>Stop</button>
      <button class="ghost" id="strix-refresh">Refresh</button>
    </div>
    <button class="ghost" id="strix-info" title="What is Strix?">ⓘ</button>
  </div>
  
  <div class="strix-tooltip hidden" id="strix-tooltip">
    Strix is an AI-powered autonomous pentesting agent that runs inside the WSL2 runtime. 
    It can scan, exploit, and report on targets with minimal human intervention.
    <br><br>
    <a href="https://github.com/strix-ai/strix" target="_blank">docs</a> | 
    <a href="https://github.com/strix-ai/strix/releases" target="_blank">releases</a>
  </div>
  
  <div class="strix-content">
    <iframe id="strix-iframe" class="strix-iframe hidden" src="about:blank" 
            frameborder="0" allowfullscreen></iframe>
    <div class="strix-log" id="strix-log"></div>
  </div>
</div>
