<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kali Linux Windows Substitute - Cheat Sheets</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="cheat-sheets-panel" class="panel hidden">
    <div class="panel-head">
      <h2>Cheat Sheets</h2>
      <button class="x" data-close="cheat-sheets-panel">&times;</button>
    </div>

    <div class="toolbar">
      <select id="cheat-sheets-tool-select" class="grow">
        <option value="">— Select a tool —</option>
      </select>
    </div>

    <div id="cheat-sheets-content" class="muted">
      — Select a tool from the dropdown to view its cheat sheet —
    </div>
  </div>
</body>
</html>
