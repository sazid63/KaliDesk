<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kali Linux Windows Substitute - Playground</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="playground-panel" class="panel hidden">
    <div class="panel-head">
      <h2>Playground</h2>
      <button class="x" data-close="playground-panel">&times;</button>
    </div>

    <p class="muted warning">
      A vulnerable Flask-like http.server app runs on 127.0.0.1:3000 inside WSL2.
    </p>

    <div class="toolbar">
      <span id="playground-status" class="muted">Not running</span>
      <div class="grow"></div>
      <button class="primary" id="playground-start">Start</button>
      <button class="ghost" id="playground-stop">Stop</button>
    </div>

    <div class="toolbar" style="margin-top: 1rem;">
      <button class="primary" id="playground-open">Open in Browser</button>
    </div>

    <p class="muted" id="playground-text">Start the playground to test security tools.</p>
  </div>
</body>
</html>
